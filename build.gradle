plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// ./gradlew -PnoCurios runGameTestServer  runs everything without Curios, to check that it really is optional.
def withCurios = !project.hasProperty('noCurios')

sourceSets {
    // In-world tests. They are part of the mod only in dev runs and never end up in the released jar.
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        if (!withCurios) {
            java.exclude '**/CuriosGameTests.java'
        }
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mods built against obfuscated names (Curios) bring Mixins that need their names translated in dev runs.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.gametest
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew -PsmokeClient runClient  walks through the visual scenes under a virtual display and quits.
            // See ClientSmoke. It loads the saved test world "smoke" from run/saves.
            if (project.hasProperty('smokeClient')) {
                property 'yperite.smoke', 'true'
                args '--quickPlaySingleplayer', 'smoke'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            // Its own directory, so that the test world never mixes with a development server world.
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Every GameTest run starts from a fresh world: gas and wind are saved with the world, and a leftover would leak
// into the next run.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete project.file('run-gametest/world')
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        name = 'Illusive Soulworks (Curios)'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curios is optional: with it the gas mask can also be worn in a "face" slot next to a helmet.
    // Only the API is needed to compile; the full mod is loaded in development runs so that it gets tested.
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if (withCurios) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
