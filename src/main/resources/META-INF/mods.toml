modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/katyusha8138/Yperite-ChemicalWarfare/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/katyusha8138/Yperite-ChemicalWarfare"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Required: draws the worn equipment. Superb Warfare bundles 4.4.6, so that is the oldest accepted.
[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "[4.4.6,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
mandatory = false
versionRange = "[5.2,)"
ordering = "NONE"
side = "BOTH"

# Optional: chemical ammunition for Superb Warfare's 40mm launchers, mortar and artillery.
[[dependencies.${mod_id}]]
modId = "superbwarfare"
mandatory = false
versionRange = "[0.8.9,)"
ordering = "AFTER"
side = "BOTH"
